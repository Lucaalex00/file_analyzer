name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies for WeasyPrint and Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info tesseract-ocr tesseract-ocr-ita
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=src --cov-fail-under=80 -v

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy in time" >&2
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend test dependencies
        working-directory: e2e
        run: npm ci
      - name: Run frontend unit tests
        working-directory: e2e
        run: npm run test:unit
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down

  docker:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image tag
        id: image
        run: echo "tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
