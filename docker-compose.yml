services:
  api:
    build: .
    ports:
      # Host-side port is configurable (HOST_PORT env var, default 8000) --
      # the container's own port stays 8000 regardless.
      - "${HOST_PORT:-8000}:8000"
    # No .env file is required to start: with no Azure OpenAI credentials
    # set, the app runs in demo mode (see src/api/config.py). If a .env
    # file exists next to this compose file, Docker Compose loads it
    # automatically for the ${...} substitutions below -- no env_file:
    # directive needed, which would otherwise make the file mandatory.
    environment:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      # Neither is baked into the image (see .dockerignore) -- mounted here
      # only so `docker compose exec api python -m scripts.generate_examples`
      # (documented in examples/README.md) actually has something to run
      # and somewhere to write its output.
      - ./scripts:/app/scripts
      - ./examples:/app/examples
      # Tests aren't in the image either. Mounting them (rather than copying
      # them in by hand) is what keeps a stale duplicate from accumulating
      # inside the container and silently inflating the test count.
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      # Rendered by the in-app docs viewer; mounted so edits show up without
      # a rebuild (they're COPYed into the image for production).
      - ./README.md:/app/README.md
      - ./OVERVIEW.md:/app/OVERVIEW.md
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
